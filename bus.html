
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🚌 香港巴士到站時間查詢 | 站牌編號即時查</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem 1rem 2.5rem;
    }
    .app-card {
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2rem;
      box-shadow: 0 20px 35px rgba(0, 20, 40, 0.15), 0 6px 12px rgba(0, 0, 0, 0.05);
      padding: 1.8rem 1.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #1a2b3c;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: #3c556b;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      border-left: 4px solid #3a7ca5;
      padding-left: 0.8rem;
      background: rgba(58, 124, 165, 0.06);
      border-radius: 0 0.5rem 0.5rem 0;
      line-height: 1.5;
    }
    .search-area {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 2rem;
    }
    .input-label {
      font-weight: 600;
      color: #1e3b4f;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .input-wrapper {
      display: flex;
      gap: 0.7rem;
    }
    #stationId {
      flex: 1;
      padding: 0.9rem 1.2rem;
      border-radius: 3rem;
      border: 2px solid #d0dde8;
      background: white;
      font-size: 1.1rem;
      font-weight: 500;
      color: #102331;
      transition: all 0.2s;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    #stationId:focus {
      border-color: #2e6a9e;
      box-shadow: 0 0 0 4px rgba(46, 106, 158, 0.15);
    }
    #stationId::placeholder {
      color: #8fa4b8;
      font-weight: 400;
    }
    button {
      background: #1f4e6f;
      border: none;
      color: white;
      padding: 0 1.6rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 6px 12px rgba(26, 60, 90, 0.2);
      border: 1px solid rgba(255,255,255,0.2);
    }
    button:hover {
      background: #1a425e;
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(26, 60, 90, 0.3);
    }
    button:active {
      transform: scale(0.98);
      background: #0f3145;
    }
    .example-hint {
      font-size: 0.85rem;
      color: #4d6b82;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .example-chip {
      background: #e9f0f6;
      padding: 0.25rem 0.8rem;
      border-radius: 1rem;
      font-weight: 500;
      color: #1b4b6c;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #cbdae6;
    }
    .example-chip:hover {
      background: #d9e5f0;
    }
    .status-message {
      min-height: 2.2rem;
      margin: 0.8rem 0 1rem;
      font-size: 0.95rem;
      color: #29485e;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .results-container {
      background: #f8fafd;
      border-radius: 1.6rem;
      padding: 1.3rem 1.2rem;
      border: 1px solid #dee8f0;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
      min-height: 180px;
    }
    .company-section {
      margin-bottom: 1.5rem;
      background: white;
      border-radius: 1.2rem;
      padding: 1rem 1rem 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid #e2ecf5;
    }
    .company-header {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1e3b4f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.7rem;
      border-bottom: 2px dashed #cbdae8;
      margin-bottom: 0.8rem;
    }
    .route-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .route-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.8rem;
      background: #f4f8fc;
      border-radius: 1rem;
      border-left: 4px solid #3b7ca5;
    }
    .route-info {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      color: #0c2638;
    }
    .route-dest {
      font-size: 0.8rem;
      color: #54738d;
      font-weight: 400;
    }
    .eta-times {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    .eta-badge {
      background: #1f4e6f;
      color: white;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }
    .eta-badge.soon {
      background: #b13e3e;
    }
    .eta-badge.medium {
      background: #b17f3e;
    }
    .no-result {
      text-align: center;
      color: #6f8ba1;
      padding: 2rem 0.5rem;
      font-style: italic;
    }
    .footer-note {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #8799a8;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(31, 78, 111, 0.3);
      border-radius: 50%;
      border-top-color: #1f4e6f;
      animation: spin 0.8s linear infinite;
      margin-left: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-card">
    <h1>🚏 巴士到站一眼知</h1>
    <div class="subtitle">輸入巴士站編號，即時顯示各巴士公司預計到站時間</div>

    <div class="search-area">
      <span class="input-label">🔎 巴士站編號</span>
      <div class="input-wrapper">
        <input type="text" id="stationId" inputmode="numeric" pattern="[0-9]*" placeholder="九巴：95421｜城巴：501234" autocomplete="off">
        <button id="searchBtn">查詢 <span id="btnIcon">🚌</span></button>
      </div>
      <div class="example-hint">
        <span>常用站點：</span>
        <span class="example-chip" data-id="95421">天瑞總站 (95421)</span>
        <span class="example-chip" data-id="93601">天水圍站 (93601)</span>
      </div>
    </div>

    <div class="status-message" id="statusMsg">
      <span>👋 請輸入巴士站編號</span>
    </div>

    <div class="results-container" id="resultsContainer">
      <div class="no-result" id="placeholderResult">
        🚌 查詢結果會顯示在這裡<br>（可點擊上方常用站點快速體驗）
      </div>
    </div>
    <div class="footer-note">
      * 數據來自運輸署開放平台。預計時間只供參考。
    </div>
  </div>

  <script>
    (function() {
      const stationInput = document.getElementById('stationId');
      const searchBtn = document.getElementById('searchBtn');
      const statusMsg = document.getElementById('statusMsg');
      const resultsContainer = document.getElementById('resultsContainer');
      const placeholderResult = document.getElementById('placeholderResult');

      function clearPlaceholder() {
        if (placeholderResult) placeholderResult.style.display = 'none';
      }

      function setStatus(message, isError = false) {
        statusMsg.innerHTML = message;
        statusMsg.style.color = isError ? '#b13e3e' : '#29485e';
      }

      function minutesFromNow(isoString) {
        if (!isoString) return null;
        const eta = new Date(isoString);
        const now = new Date();
        const diffMs = eta - now;
        if (diffMs < 0) return 0;
        return Math.round(diffMs / 60000);
      }

      async function performSearch() {
        const rawId = stationInput.value.trim();
        if (!rawId) {
          setStatus('⚠️ 請先輸入巴士站編號', true);
          resultsContainer.innerHTML = `<div class="no-result">輸入編號後按「查詢」</div>`;
          return;
        }

        if (!/^\d{5,6}$/.test(rawId)) {
          setStatus('⚠️ 九巴站號係5位數，城巴/新巴係6位數', true);
          return;
        }

        setStatus(`🔍 正在查詢「${rawId}」的即時到站資料... <span class="loader"></span>`);
        searchBtn.disabled = true;
        searchBtn.innerHTML = '查詢中...';

        resultsContainer.innerHTML = '';

        let urls = [];
        if (rawId.length === 5) {
          urls.push({ name: '九巴 / 龍運', url: `https://data.etabus.gov.hk/v1/transport/batch/stop-eta/kmb/${rawId}` });
        } else if (rawId.length === 6) {
          urls.push({ name: '城巴 / 新巴', url: `https://data.etabus.gov.hk/v1/transport/batch/stop-eta/ctb/${rawId}` });
        }

        const allResults = {};

        try {
          for (const entry of urls) {
            const resp = await fetch(entry.url);
            if (!resp.ok) continue;
            const data = await resp.json();
            if (data.eta && data.eta.length > 0) {
              allResults[entry.name] = data.eta;
            }
          }

          clearPlaceholder();

          if (Object.keys(allResults).length === 0) {
            setStatus('ℹ️ 暫時沒有巴士預計到站資料');
            resultsContainer.innerHTML = `<div class="no-result">冇即時到站數據。可能收車、暫停服務或者該站唔支援實時預報。</div>`;
            return;
          }

          let html = '';
          for (const compName of Object.keys(allResults)) {
            const etaList = allResults[compName];
            html += `<div class="company-section">`;
            html += `<div class="company-header">🏢 ${compName}</div>`;
            html += `<div class="route-list">`;

            const routes = {};
            for (const e of etaList) {
              const key = e.route + '|' + e.dest_tc;
              if (!routes[key]) {
                routes[key] = { route: e.route, dest: e.dest_tc, times: [] };
              }
              const min = minutesFromNow(e.eta);
              if (min !== null) {
                routes[key].times.push(min);
              }
            }

            for (const k of Object.keys(routes)) {
              const r = routes[k];
              const badges = r.times.map(m => {
                let cls = 'eta-badge';
                if (m <= 5) cls += ' soon';
                else if (m <= 15) cls += ' medium';
                return `<span class="${cls}">${m} 分鐘</span>`;
              }).join('');

              html += `
                <div class="route-item">
                  <div class="route-info">
                    <span>${r.route} <span style="font-weight:400; margin-left:0.2rem;">往</span> ${r.dest}</span>
                    <span class="route-dest">目的地：${r.dest}</span>
                  </div>
                  <div class="eta-times">${badges}</div>
                </div>
              `;
            }

            html += `</div></div>`;
          }

          setStatus(`✅ 成功取得到站預報`);
          resultsContainer.innerHTML = html;

        } catch (err) {
          setStatus('❌ 網絡或者伺服器錯誤，請稍後再試', true);
          resultsContainer.innerHTML = `<div class="no-result">${err.message}</div>`;
        }

        searchBtn.disabled = false;
        searchBtn.innerHTML = '查詢 <span id="btnIcon">🚌</span>';
      }

      function setupExampleChips() {
        const chips = document.querySelectorAll('.example-chip');
        chips.forEach(chip => {
          chip.addEventListener('click', (e) => {
            const id = e.target.getAttribute('data-id');
            if (id) {
              stationInput.value = id;
              performSearch();
            }
          });
        });
      }

      stationInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          performSearch();
        }
      });

      searchBtn.addEventListener('click', performSearch);
      setupExampleChips();

      setStatus('👋 請輸入巴士站編號（可點擊下方常用站點）');
    })();
  </script>
</body>
</html>
