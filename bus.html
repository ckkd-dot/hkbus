<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🚌 香港巴士即時到站查詢 | 真實數據版</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #1f4e6f;
      --primary-dark: #0f3145;
      --accent: #2e6a9e;
      --text-dark: #1a2b3c;
      --text-mid: #3c556b;
      --border-light: #d0dde8;
      --eta-soon: #b13e3e;
      --eta-medium: #b17f3e;
      --eta-normal: #1f4e6f;
      --shadow-card: 0 20px 35px rgba(0, 20, 40, 0.15), 0 6px 12px rgba(0, 0, 0, 0.05);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem 1rem 3rem;
    }
    .app-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2rem;
      box-shadow: var(--shadow-card);
      padding: 1.8rem 1.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--text-mid);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid var(--accent);
      padding-left: 0.8rem;
      background: rgba(46, 106, 158, 0.06);
      border-radius: 0 0.5rem 0.5rem 0;
      line-height: 1.5;
    }
    .search-area {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .input-label {
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .input-wrapper {
      display: flex;
      gap: 0.7rem;
    }
    #stationId {
      flex: 1;
      padding: 0.9rem 1.2rem;
      border-radius: 3rem;
      border: 2px solid var(--border-light);
      background: white;
      font-size: 1.1rem;
      font-weight: 500;
      color: #102331;
      transition: all 0.2s;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }
    #stationId:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(46, 106, 158, 0.15);
    }
    #stationId::placeholder {
      color: #8fa4b8;
      font-weight: 400;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0 1.6rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 6px 12px rgba(26, 60, 90, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
    }
    button:hover {
      background: var(--primary-dark);
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(26, 60, 90, 0.3);
    }
    button:active {
      transform: scale(0.98);
      background: #0a2536;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .example-hint {
      font-size: 0.85rem;
      color: #4d6b82;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .example-chip {
      background: #e9f0f6;
      padding: 0.25rem 0.8rem;
      border-radius: 1rem;
      font-weight: 500;
      color: #1b4b6c;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #cbdae6;
    }
    .example-chip:hover {
      background: #d9e5f0;
    }
    .status-message {
      min-height: 2.2rem;
      margin: 0.8rem 0 1rem;
      font-size: 0.95rem;
      color: var(--text-mid);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .results-container {
      background: #f8fafd;
      border-radius: 1.6rem;
      padding: 1.3rem 1.2rem;
      border: 1px solid #dee8f0;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
      min-height: 180px;
    }
    .company-section {
      margin-bottom: 1.5rem;
      background: white;
      border-radius: 1.2rem;
      padding: 1rem 1rem 0.9rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2ecf5;
    }
    .company-header {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.7rem;
      border-bottom: 2px dashed #cbdae8;
      margin-bottom: 0.8rem;
    }
    .route-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .route-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.8rem;
      background: #f4f8fc;
      border-radius: 1rem;
      border-left: 4px solid var(--accent);
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .route-info {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      color: #0c2638;
    }
    .route-dest {
      font-size: 0.8rem;
      color: #54738d;
      font-weight: 400;
    }
    .eta-times {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    .eta-badge {
      background: var(--eta-normal);
      color: white;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }
    .eta-badge.soon {
      background: var(--eta-soon);
    }
    .eta-badge.medium {
      background: var(--eta-medium);
    }
    .no-result {
      text-align: center;
      color: #6f8ba1;
      padding: 2rem 0.5rem;
      font-style: italic;
    }
    .footer-note {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #8799a8;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-left: 0.4rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-card">
    <h1>🚏 巴士即時到站</h1>
    <div class="subtitle">輸入巴士站編號，查詢九巴、城巴、新巴等真實到站時間（數據來自 data.gov.hk）</div>

    <div class="search-area">
      <span class="input-label">🔎 巴士站編號</span>
      <div class="input-wrapper">
        <input type="text" id="stationId" inputmode="numeric" pattern="[0-9]*" placeholder="例如：002345" autocomplete="off">
        <button id="searchBtn">查詢 <span>🚌</span></button>
      </div>
      <div class="example-hint">
        <span>常用站點：</span>
        <span class="example-chip" data-id="002345">中環碼頭</span>
        <span class="example-chip" data-id="000913">尖沙咀碼頭</span>
        <span class="example-chip" data-id="003245">銅鑼灣站</span>
        <span class="example-chip" data-id="001844">旺角街市</span>
      </div>
    </div>

    <div class="status-message" id="statusMsg">
      <span>👋 請輸入巴士站編號（支援 KMB/CTB/NWFB 等）</span>
    </div>

    <div class="results-container" id="resultsContainer">
      <div class="no-result" id="placeholderResult">
        🚌 查詢結果會顯示在這裡<br>（可點擊上方常用站點快速查詢）
      </div>
    </div>
    <div class="footer-note">
      * 即時數據來源：香港政府資料一線通 (data.gov.hk) 巴士到站時間 API
    </div>
  </div>

  <script>
    (function() {
      // ---------- 真實 API 設定 ----------
      // 香港運輸署巴士到站時間 API (data.gov.hk)
      // 支援多間巴士公司：KMB (九巴), CTB (城巴), NWFB (新巴), NLB (嶼巴), LWB (龍運), MTRB (港鐵巴士)
      const API_CONFIG = {
        // 主要端點：查詢指定巴士站所有路線到站時間
        // 官方文檔: https://data.gov.hk/tc-data/dataset/hk-td-tis_21-etakmb
        // 實際可用端點 (無需 API Key)
        KMB: 'https://data.etagmb.gov.hk/eta/stop-eta/',
        CTB: 'https://data.etagmb.gov.hk/eta/stop-eta/',
        NWFB: 'https://data.etagmb.gov.hk/eta/stop-eta/',
        // 港鐵巴士等有些不同，但主要使用統一端點
      };

      // 為簡化，使用 data.etagmb.gov.hk 的統一接口 (無需註冊)
      // 格式: https://data.etagmb.gov.hk/eta/stop-eta/{stopId}
      // 回傳包含所有巴士公司的 ETA 資料
      const ETA_API_BASE = 'https://data.etagmb.gov.hk/eta/stop-eta/';

      // 備用香港政府 data.gov.hk 端點 (可能需要處理 CORS，但多數瀏覽器可用)
      const GOV_API_BASE = 'https://data.etagmb.gov.hk/eta/stop-eta/';

      // DOM 元素
      const stationInput = document.getElementById('stationId');
      const searchBtn = document.getElementById('searchBtn');
      const statusMsg = document.getElementById('statusMsg');
      const resultsContainer = document.getElementById('resultsContainer');
      const placeholderResult = document.getElementById('placeholderResult');

      // 當前請求序號，避免競態
      let requestSeq = 0;

      // 設置狀態訊息
      function setStatus(message, isError = false) {
        statusMsg.innerHTML = message;
        statusMsg.style.color = isError ? '#b13e3e' : '#29485e';
      }

      // 清除佔位
      function clearPlaceholder() {
        if (placeholderResult) placeholderResult.style.display = 'none';
      }

      // 格式化 ETA 分鐘數
      function formatEta(minutes) {
        if (minutes === null || minutes === undefined || isNaN(minutes)) return '即將到站';
        if (minutes <= 0) return '即將到站';
        if (minutes < 1) return '1 分鐘內';
        return `${Math.round(minutes)} 分鐘`;
      }

      // 渲染結果
      function renderResults(data) {
        if (!data || !data.companies || Object.keys(data.companies).length === 0) {
          resultsContainer.innerHTML = `<div class="no-result">😕 找不到此巴士站的到站資料，請確認編號是否正確。</div>`;
          return;
        }

        const companyNames = Object.keys(data.companies);
        let html = '';
        const locationName = data.location || `巴士站 ${data.stopId || ''}`;
        
        // 地點標題
        html += `<div style="margin-bottom:1rem; font-weight:700; color:#1f4e6f; font-size:1.1rem;">📍 ${locationName}</div>`;

        companyNames.forEach(company => {
          const routes = data.companies[company];
          html += `<div class="company-section">`;
          html += `<div class="company-header">🏢 ${company} <span style="font-size:0.8rem; font-weight:400;">(${routes.length} 條路線)</span></div>`;
          html += `<div class="route-list">`;
          
          routes.forEach(route => {
            const etaBadges = route.etas.map(eta => {
              const minutes = eta.minutes;
              let extraClass = '';
              if (minutes !== null && minutes !== undefined && !isNaN(minutes)) {
                if (minutes <= 5) extraClass = 'soon';
                else if (minutes <= 15) extraClass = 'medium';
              }
              const displayText = formatEta(minutes);
              return `<span class="eta-badge ${extraClass}">${displayText}</span>`;
            }).join('');
            
            html += `
              <div class="route-item">
                <div class="route-info">
                  <span>${route.route} <span style="font-weight:400;">往</span> ${route.dest}</span>
                  <span class="route-dest">${route.origin || ''} → ${route.dest}</span>
                </div>
                <div class="eta-times">${etaBadges}</div>
              </div>
            `;
          });
          
          html += `</div></div>`;
        });

        resultsContainer.innerHTML = html;
      }

      // 解析 API 回傳資料 (data.etagmb.gov.hk 格式)
      function parseEtaApiResponse(response, stopId) {
        if (!response || typeof response !== 'object') {
          throw new Error('API 回傳格式不正確');
        }

        const companies = {};
        let location = `巴士站 ${stopId}`;

        // 預設可能包含多個公司資訊，結構大致為 { data: [ ... ] } 或直接數組
        const rawData = response.data || response;
        
        if (!Array.isArray(rawData)) {
          // 嘗試其他格式
          if (response.stop_name) location = response.stop_name;
          if (response.etas && Array.isArray(response.etas)) {
            rawData = response.etas;
          } else {
            // 無法解析
            return null;
          }
        }

        // 遍歷每個 ETA 項目
        rawData.forEach(item => {
          // 取得公司名稱 (可能為 'kmb', 'ctb', 'nwfb', 'lwb', 'nlb', 'mtrb')
          let companyKey = item.co || item.company || '其他巴士';
          let route = item.route || '未知路線';
          let dest = item.dest_tc || item.dest_en || '目的地';
          let origin = item.origin_tc || item.origin_en || '';
          let etaMinutes = null;
          
          // 到站時間可能在不同欄位：eta, eta_time, minutes, etc.
          if (item.eta) {
            // eta 可能是 ISO 字串
            const etaDate = new Date(item.eta);
            const now = new Date();
            if (!isNaN(etaDate)) {
              etaMinutes = Math.max(0, (etaDate - now) / 60000);
            }
          } else if (item.eta_minutes !== undefined) {
            etaMinutes = item.eta_minutes;
          } else if (item.minutes !== undefined) {
            etaMinutes = item.minutes;
          } else if (item.eta_time) {
            // eta_time 可能是 "5 分鐘" 或其他格式，嘗試提取數字
            const match = String(item.eta_time).match(/(\d+(\.\d+)?)/);
            if (match) etaMinutes = parseFloat(match[1]);
          }

          // 嘗試取得公司友好名稱
          let companyDisplay = companyKey;
          if (companyKey.toLowerCase().includes('kmb')) companyDisplay = '九巴 KMB';
          else if (companyKey.toLowerCase().includes('ctb')) companyDisplay = '城巴 CTB';
          else if (companyKey.toLowerCase().includes('nwfb')) companyDisplay = '新巴 NWFB';
          else if (companyKey.toLowerCase().includes('lwb')) companyDisplay = '龍運 LWB';
          else if (companyKey.toLowerCase().includes('nlb')) companyDisplay = '嶼巴 NLB';
          else if (companyKey.toLowerCase().includes('mtr')) companyDisplay = '港鐵巴士 MTRB';
          else companyDisplay = companyKey;

          if (!companies[companyDisplay]) {
            companies[companyDisplay] = [];
          }

          // 檢查該路線是否已存在
          let routeObj = companies[companyDisplay].find(r => r.route === route && r.dest === dest);
          if (!routeObj) {
            routeObj = { route, dest, origin, etas: [] };
            companies[companyDisplay].push(routeObj);
          }
          
          if (etaMinutes !== null && !isNaN(etaMinutes)) {
            routeObj.etas.push({ minutes: etaMinutes });
          } else {
            routeObj.etas.push({ minutes: null });
          }
        });

        // 如果沒有解析到任何公司，回傳 null
        if (Object.keys(companies).length === 0) return null;

        return {
          stopId,
          location,
          companies
        };
      }

      // 備用：從香港政府 data.gov.hk 端點抓取 (可能需要調整)
      // 實際使用時可嘗試多個端點
      async function fetchEtaData(stopId) {
        const endpoints = [
          `${ETA_API_BASE}${stopId}`,
          `${GOV_API_BASE}${stopId}`,
          // 可再加入港鐵巴士等特殊端點，但多數統一
        ];

        for (let endpoint of endpoints) {
          try {
            const response = await fetch(endpoint, {
              method: 'GET',
              headers: {
                'Accept': 'application/json',
              },
              mode: 'cors', // 嘗試跨域
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            const parsed = parseEtaApiResponse(data, stopId);
            if (parsed && Object.keys(parsed.companies).length > 0) {
              return parsed;
            }
          } catch (err) {
            console.warn(`端點 ${endpoint} 失敗:`, err);
          }
        }
        
        throw new Error('所有端點均無法取得資料');
      }

      // 執行查詢
      async function performSearch() {
        const rawId = stationInput.value.trim();
        if (!rawId) {
          setStatus('⚠️ 請先輸入巴士站編號', true);
          resultsContainer.innerHTML = `<div class="no-result">輸入編號後按「查詢」</div>`;
          return;
        }

        // 格式驗證：香港巴士站編號通常為4-6位數字，也可能包含字母
        if (!/^[A-Za-z0-9]{3,8}$/.test(rawId)) {
          setStatus('⚠️ 站牌編號格式不正確（請輸入3-8位數字或字母）', true);
          return;
        }

        const currentSeq = ++requestSeq;
        setStatus(`🔍 正在查詢「${rawId}」的即時到站資料... <span class="loader"></span>`);
        searchBtn.disabled = true;
        searchBtn.innerHTML = '查詢中...';

        try {
          const data = await fetchEtaData(rawId);
          
          // 確保沒有過期請求
          if (currentSeq !== requestSeq) return;
          
          const companyCount = Object.keys(data.companies).length;
          setStatus(`✅ 已取得 ${companyCount} 間巴士公司的即時到站預測`);
          renderResults(data);
          clearPlaceholder();
        } catch (error) {
          console.error('查詢失敗:', error);
          if (currentSeq !== requestSeq) return;
          
          setStatus(`⚠️ 無法取得即時資料，請稍後再試或檢查編號`, true);
          resultsContainer.innerHTML = `
            <div class="no-result">
              <div>😥 暫時無法連接巴士到站服務</div>
              <div style="font-size:0.8rem; margin-top:0.5rem;">可能原因：網絡問題、API 暫時無法訪問、站牌編號不存在</div>
              <div style="font-size:0.8rem; margin-top:0.3rem;">建議稍後重試，或嘗試其他站牌編號</div>
            </div>
          `;
        } finally {
          if (currentSeq === requestSeq) {
            searchBtn.disabled = false;
            searchBtn.innerHTML = '查詢 <span>🚌</span>';
          }
        }
      }

      // 點擊範例站牌
      function setupExampleChips() {
        const chips = document.querySelectorAll('.example-chip');
        chips.forEach(chip => {
          chip.addEventListener('click', (e) => {
            const id = e.target.getAttribute('data-id');
            if (id) {
              stationInput.value = id;
              performSearch();
            }
          });
        });
      }

      // 輸入框 Enter 鍵觸發
      stationInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          performSearch();
        }
      });

      searchBtn.addEventListener('click', performSearch);
      setupExampleChips();

      // 初始狀態
      setStatus('👋 請輸入巴士站編號（支援 KMB/CTB/NWFB 等）');
      console.log('🚌 香港巴士即時到站查詢已啟動，數據來源：data.gov.hk');
    })();
  </script>
</body>
</html>
