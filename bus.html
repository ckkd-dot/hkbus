<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 香港巴士到站查詢</title>
    <!-- 網頁圖標 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='90' font-size='90'>🚌</text></svg>">
    <meta name="theme-color" content="#0052cc">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans HK", sans-serif;
        }
        body {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 16px;
            background-color: #f7f9fc;
            color: #222;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #0052cc;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }
        input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background: #0040a0;
        }
        .result {
            margin-top: 16px;
            min-height: 60px;
        }
        .entry {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .route-no {
            font-size:18px;
            font-weight:bold;
            color:#0052cc;
        }
        .dest {
            margin:4px 0;
        }
        .eta-time {
            color:#d03c3c;
            font-weight:bold;
        }
        .remarks {
            font-size:12px;
            color:#666;
            margin-top:4px;
        }
        .note {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚌 香港巴士到站查詢</h1>
        <p>輸入 <b>巴士站編號</b>（例如天瑞總站：95421），查詢九巴 / 新巴城巴預計到站時間</p>
        <div class="input-row">
            <input id="stopId" placeholder="輸入巴士站編號，如95421">
            <button onclick="queryBus()">查詢</button>
        </div>
        <div class="note">
            💡 提示：站號印喺巴士站嘅告示牌。數據來自運輸署開放API。
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        async function queryBus() {
            const stopId = document.getElementById("stopId").value.trim();
            const resultBox = document.getElementById("result");

            if (!stopId) {
                resultBox.innerHTML = "<p style='color:red'>請輸入巴士站編號！</p>";
                return;
            }
            resultBox.innerHTML = "<p>查詢中……</p>";

            let apiUrl = "";
            // 規則：5位數開頭9 = 九巴；開頭5 = 新巴城巴
            if(stopId.startsWith("9")){
                apiUrl = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`;
            }else if(stopId.startsWith("5")){
                apiUrl = `https://data.etagmb.gov.hk/eta/stop/${stopId}`;
            }else{
                resultBox.innerHTML = "<p style='color:red'>無法辨識站號，九巴站號多數9開頭，新巴城巴5開頭</p>";
                return;
            }

            try {
                const res = await fetch(apiUrl);
                const rawData = await res.json();
                const list = rawData.data;

                if (!list || list.length === 0) {
                    resultBox.innerHTML = "<p>暫時冇巴士預計到站資料。可能站號錯誤，或者冇巴士途經。</p>";
                    return;
                }

                let html = "";
                list.forEach(item => {
                    let etaText = "暫無預計時間";
                    if(item.eta){
                        const etaDate = new Date(item.eta);
                        etaText = etaDate.toLocaleTimeString("zh-HK", {hour:"2-digit", minute:"2-digit"});
                    }
                    html += `
                    <div class="entry">
                        <div class="route-no">${item.route}</div>
                        <div class="dest">往：${item.dest_tc}</div>
                        <div>預計到站：<span class="eta-time">${etaText}</span></div>
                        <div class="remarks">${item.remarks_tc || ""}</div>
                    </div>
                    `;
                });
                resultBox.innerHTML = html;
            } catch (err) {
                resultBox.innerHTML = `
                    <p style='color:red'>查詢失敗</p>
                    <p class="note">
                        ⚠️ 如果直接打開本機bus.html檔案會觸發瀏覽器跨域限制。
                        上載到GitHub Pages先可以正常查詢。
                    </p>`;
                console.error(err);
            }
        }
    </script>
</body>
</html>
