<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🚌 香港巴士到站時間查詢 | 站牌編號即時查</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem 1rem 2.5rem;
    }
    .app-card {
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2rem;
      box-shadow: 0 20px 35px rgba(0, 20, 40, 0.15), 0 6px 12px rgba(0, 0, 0, 0.05);
      padding: 1.8rem 1.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #1a2b3c;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: #3c556b;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      border-left: 4px solid #3a7ca5;
      padding-left: 0.8rem;
      background: rgba(58, 124, 165, 0.06);
      border-radius: 0 0.5rem 0.5rem 0;
      line-height: 1.5;
    }
    .search-area {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 2rem;
    }
    .input-label {
      font-weight: 600;
      color: #1e3b4f;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .input-wrapper {
      display: flex;
      gap: 0.7rem;
    }
    #stationId {
      flex: 1;
      padding: 0.9rem 1.2rem;
      border-radius: 3rem;
      border: 2px solid #d0dde8;
      background: white;
      font-size: 1.1rem;
      font-weight: 500;
      color: #102331;
      transition: all 0.2s;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    #stationId:focus {
      border-color: #2e6a9e;
      box-shadow: 0 0 0 4px rgba(46, 106, 158, 0.15);
    }
    #stationId::placeholder {
      color: #8fa4b8;
      font-weight: 400;
    }
    button {
      background: #1f4e6f;
      border: none;
      color: white;
      padding: 0 1.6rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 6px 12px rgba(26, 60, 90, 0.2);
      border: 1px solid rgba(255,255,255,0.2);
    }
    button:hover {
      background: #1a425e;
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(26, 60, 90, 0.3);
    }
    button:active {
      transform: scale(0.98);
      background: #0f3145;
    }
    .example-hint {
      font-size: 0.85rem;
      color: #4d6b82;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .example-chip {
      background: #e9f0f6;
      padding: 0.25rem 0.8rem;
      border-radius: 1rem;
      font-weight: 500;
      color: #1b4b6c;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #cbdae6;
    }
    .example-chip:hover {
      background: #d9e5f0;
    }
    .status-message {
      min-height: 2.2rem;
      margin: 0.8rem 0 1rem;
      font-size: 0.95rem;
      color: #29485e;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .results-container {
      background: #f8fafd;
      border-radius: 1.6rem;
      padding: 1.3rem 1.2rem;
      border: 1px solid #dee8f0;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
      min-height: 180px;
    }
    .company-section {
      margin-bottom: 1.5rem;
      background: white;
      border-radius: 1.2rem;
      padding: 1rem 1rem 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid #e2ecf5;
    }
    .company-header {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1e3b4f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.7rem;
      border-bottom: 2px dashed #cbdae8;
      margin-bottom: 0.8rem;
    }
    .route-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .route-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.8rem;
      background: #f4f8fc;
      border-radius: 1rem;
      border-left: 4px solid #3b7ca5;
    }
    .route-info {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      color: #0c2638;
    }
    .route-dest {
      font-size: 0.8rem;
      color: #54738d;
      font-weight: 400;
    }
    .eta-times {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    .eta-badge {
      background: #1f4e6f;
      color: white;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }
    .eta-badge.soon {
      background: #b13e3e;
    }
    .eta-badge.medium {
      background: #b17f3e;
    }
    .no-result {
      text-align: center;
      color: #6f8ba1;
      padding: 2rem 0.5rem;
      font-style: italic;
    }
    .footer-note {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #8799a8;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-left: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-card">
    <h1>🚏 巴士到站一眼知</h1>
    <div class="subtitle">輸入巴士站編號，即時顯示各巴士公司預計到站時間</div>

    <div class="search-area">
      <span class="input-label">🔎 巴士站編號</span>
      <div class="input-wrapper">
        <input type="text" id="stationId" inputmode="numeric" pattern="[0-9]*" placeholder="例如：002345" autocomplete="off">
        <button id="searchBtn">查詢 <span id="btnIcon">🚌</span></button>
      </div>
      <div class="example-hint">
        <span>常用站點：</span>
        <span class="example-chip" data-id="002345">中環碼頭</span>
        <span class="example-chip" data-id="000913">尖沙咀碼頭</span>
        <span class="example-chip" data-id="003245">銅鑼灣站</span>
        <span class="example-chip" data-id="001844">旺角街市</span>
      </div>
    </div>

    <div class="status-message" id="statusMsg">
      <span>👋 請輸入巴士站編號</span>
    </div>

    <div class="results-container" id="resultsContainer">
      <div class="no-result" id="placeholderResult">
        🚌 查詢結果會顯示在這裡<br>（可點擊上方常用站點快速體驗）
      </div>
    </div>
    <div class="footer-note">
      * 模擬資料僅供展示，實際到站時間以運輸署及巴士公司公佈為準
    </div>
  </div>

  <script>
    (function() {
      // ---------- 模擬巴士公司資料庫 (真實站牌編號格式) ----------
      // 依照香港巴士站編號特徵：通常為六位數字，首位可能為0或字母開頭（如CTB、KMB等）
      // 但為示範，我們使用純數字編號，同時映射到多間公司
      const mockDatabase = {
        '002345': {   // 中環碼頭
          location: '中環碼頭',
          companies: {
            '九巴 KMB': [
              { route: '1A', dest: '中秀茂坪', etas: ['2 分鐘', '12 分鐘', '25 分鐘'] },
              { route: '2', dest: '蘇屋', etas: ['5 分鐘', '18 分鐘'] },
              { route: '5C', dest: '慈雲山(中)', etas: ['8 分鐘', '22 分鐘', '35 分鐘'] }
            ],
            '城巴 CTB': [
              { route: '11', dest: '渣甸山', etas: ['3 分鐘', '16 分鐘'] },
              { route: '25', dest: '寶馬山', etas: ['7 分鐘', '28 分鐘', '42 分鐘'] },
              { route: '780', dest: '柴灣(東)', etas: ['1 分鐘', '9 分鐘', '19 分鐘'] }
            ],
            '新巴 NWFB': [
              { route: '15', dest: '山頂', etas: ['4 分鐘', '14 分鐘'] },
              { route: '94', dest: '利東邨', etas: ['12 分鐘', '26 分鐘'] }
            ]
          }
        },
        '000913': {   // 尖沙咀碼頭
          location: '尖沙咀天星碼頭',
          companies: {
            '九巴 KMB': [
              { route: '1', dest: '竹園邨', etas: ['3 分鐘', '17 分鐘', '31 分鐘'] },
              { route: '1A', dest: '中秀茂坪', etas: ['6 分鐘', '15 分鐘'] },
              { route: '5A', dest: '啟德(啟晴邨)', etas: ['9 分鐘', '24 分鐘'] }
            ],
            '城巴 CTB': [
              { route: '973', dest: '赤柱村', etas: ['11 分鐘', '30 分鐘'] },
              { route: 'A21', dest: '紅磡站', etas: ['5 分鐘', '12 分鐘', '22 分鐘'] }
            ]
          }
        },
        '003245': {   // 銅鑼灣站
          location: '銅鑼灣站',
          companies: {
            '城巴 CTB': [
              { route: '5B', dest: '堅尼地城', etas: ['2 分鐘', '9 分鐘', '20 分鐘'] },
              { route: '8X', dest: '小西灣(藍灣半島)', etas: ['4 分鐘', '14 分鐘'] },
              { route: '10', dest: '北角碼頭', etas: ['1 分鐘', '7 分鐘', '13 分鐘'] }
            ],
            '九巴 KMB': [
              { route: '108', dest: '啟業', etas: ['8 分鐘', '19 分鐘'] },
              { route: '112', dest: '蘇屋', etas: ['3 分鐘', '16 分鐘', '27 分鐘'] }
            ],
            '新巴 NWFB': [
              { route: '2A', dest: '耀東邨', etas: ['6 分鐘', '21 分鐘'] },
              { route: '23', dest: '蒲飛路', etas: ['10 分鐘', '25 分鐘'] }
            ]
          }
        },
        '001844': {   // 旺角街市
          location: '旺角街市',
          companies: {
            '九巴 KMB': [
              { route: '6', dest: '荔枝角', etas: ['2 分鐘', '13 分鐘', '23 分鐘'] },
              { route: '9', dest: '坪石', etas: ['7 分鐘', '20 分鐘'] },
              { route: '27', dest: '順天', etas: ['5 分鐘', '15 分鐘', '30 分鐘'] },
              { route: '95', dest: '翠林', etas: ['11 分鐘', '24 分鐘'] }
            ],
            '城巴 CTB': [
              { route: '20A', dest: '高鐵西九龍站', etas: ['4 分鐘', '18 分鐘'] },
              { route: '701', dest: '海麗邨', etas: ['2 分鐘', '10 分鐘'] }
            ],
            '新巴 NWFB': [
              { route: '104', dest: '白田', etas: ['6 分鐘', '19 分鐘', '32 分鐘'] }
            ]
          }
        }
      };

      // 通用後備資料 (若輸入未知編號，生成動態模擬)
      function getFallbackData(stationId) {
        const companies = ['九巴 KMB', '城巴 CTB', '新巴 NWFB', '龍運 LWB'];
        const routesPool = [
          { route: '6A', dest: '荔枝角' },
          { route: '12', dest: '中環碼頭' },
          { route: '33A', dest: '荃灣如心廣場' },
          { route: '70', dest: '佐敦(西九龍站)' },
          { route: '98D', dest: '坑口北' },
          { route: '290', dest: '將軍澳工業邨' },
          { route: 'A31', dest: '機場地面運輸中心' },
          { route: 'E23', dest: '慈雲山(南)' }
        ];
        const randomCount = 2 + Math.floor(Math.random() * 3);
        const randomCompanies = [...companies].sort(() => Math.random() - 0.5).slice(0, 2 + Math.floor(Math.random() * 2));
        const result = {};
        randomCompanies.forEach(comp => {
          const routeList = [];
          const routeCount = 2 + Math.floor(Math.random() * 2);
          for (let i = 0; i < routeCount; i++) {
            const randomRoute = routesPool[Math.floor(Math.random() * routesPool.length)];
            const etaCount = 2 + Math.floor(Math.random() * 3);
            const etas = [];
            for (let j = 0; j < etaCount; j++) {
              etas.push(`${2 + Math.floor(Math.random() * 28)} 分鐘`);
            }
            routeList.push({
              route: randomRoute.route,
              dest: randomRoute.dest,
              etas: etas
            });
          }
          result[comp] = routeList;
        });
        return { location: `自訂站點 (編號 ${stationId})`, companies: result };
      }

      // DOM 元素
      const stationInput = document.getElementById('stationId');
      const searchBtn = document.getElementById('searchBtn');
      const statusMsg = document.getElementById('statusMsg');
      const resultsContainer = document.getElementById('resultsContainer');
      const placeholderResult = document.getElementById('placeholderResult');

      // 清除結果區佔位
      function clearPlaceholder() {
        if (placeholderResult) placeholderResult.style.display = 'none';
      }

      // 顯示狀態訊息
      function setStatus(message, isError = false) {
        statusMsg.innerHTML = message;
        statusMsg.style.color = isError ? '#b13e3e' : '#29485e';
      }

      // 渲染結果
      function renderResults(data) {
        if (!data || !data.companies || Object.keys(data.companies).length === 0) {
          resultsContainer.innerHTML = `<div class="no-result">😕 沒有找到此巴士站的到站資料，請確認編號是否正確。</div>`;
          return;
        }

        let html = '';
        const companyNames = Object.keys(data.companies);
        companyNames.forEach(company => {
          const routes = data.companies[company];
          html += `<div class="company-section">`;
          html += `<div class="company-header">🏢 ${company}</div>`;
          html += `<div class="route-list">`;
          routes.forEach(route => {
            const etaBadges = route.etas.map(eta => {
              // 標記「即將到站」的顏色
              let extraClass = '';
              const minutes = parseInt(eta, 10);
              if (!isNaN(minutes)) {
                if (minutes <= 5) extraClass = 'soon';
                else if (minutes <= 15) extraClass = 'medium';
              }
              return `<span class="eta-badge ${extraClass}">${eta}</span>`;
            }).join('');
            html += `
              <div class="route-item">
                <div class="route-info">
                  <span>${route.route} <span style="font-weight:400; margin-left:0.2rem;">往</span> ${route.dest}</span>
                  <span class="route-dest">目的地：${route.dest}</span>
                </div>
                <div class="eta-times">${etaBadges}</div>
              </div>
            `;
          });
          html += `</div></div>`;
        });

        // 加入地點標示
        const locationName = data.location || '';
        html = `<div style="margin-bottom:0.8rem; font-weight:600; color:#1f4e6f; display:flex; align-items:center; gap:0.3rem;">📍 ${locationName}</div>` + html;
        resultsContainer.innerHTML = html;
      }

      // 查詢函數
      function performSearch() {
        const rawId = stationInput.value.trim();
        if (!rawId) {
          setStatus('⚠️ 請先輸入巴士站編號', true);
          resultsContainer.innerHTML = `<div class="no-result">輸入編號後按「查詢」</div>`;
          return;
        }

        // 僅允許數字（可選：加上英文站牌代號過濾）
        if (!/^\d{4,6}$/.test(rawId)) {
          setStatus('⚠️ 站牌編號通常為4～6位數字，請重新輸入', true);
          return;
        }

        // 模擬載入狀態
        setStatus(`🔍 正在查詢「${rawId}」的即時到站資料... <span class="loader"></span>`);
        searchBtn.disabled = true;
        searchBtn.innerHTML = '查詢中...';

        // 模擬延遲 400ms
        setTimeout(() => {
          let data = mockDatabase[rawId];
          if (!data) {
            data = getFallbackData(rawId);
          }

          // 更新狀態與渲染
          const companyCount = Object.keys(data.companies).length;
          setStatus(`✅ 已顯示 ${companyCount} 間巴士公司的到站預測`);
          renderResults(data);
          clearPlaceholder();

          searchBtn.disabled = false;
          searchBtn.innerHTML = '查詢 <span id="btnIcon">🚌</span>';
        }, 400);
      }

      // 點擊範例站牌
      function setupExampleChips() {
        const chips = document.querySelectorAll('.example-chip');
        chips.forEach(chip => {
          chip.addEventListener('click', (e) => {
            const id = e.target.getAttribute('data-id');
            if (id) {
              stationInput.value = id;
              performSearch();
            }
          });
        });
      }

      // 輸入框 Enter 鍵觸發
      stationInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          performSearch();
        }
      });

      searchBtn.addEventListener('click', performSearch);
      setupExampleChips();

      // 初始顯示一個範例（可選）
      // 預設為空，但可以提供一個誘導提示
      setStatus('👋 請輸入巴士站編號（可點擊下方常用站點）');
    })();
  </script>
</body>
</html>
